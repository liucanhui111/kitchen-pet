<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2.5D 等距厨房 - 电子宠物背景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .container { width: 900px; height: 1200px; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="clay" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset dx="5" dy="8" result="o"/>
      <feFlood flood-color="#4a3020" flood-opacity="0.15" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowH" x="-15%" y="-15%" width="130%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset dx="6" dy="12" result="o"/>
      <feFlood flood-color="#3a2010" flood-opacity="0.2" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <radialGradient id="warmGlow" cx="70%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#FFE8B0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD080" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ==================== 底座 ==================== -->
  <g id="base">
    <polygon points="450,1050 810,840 450,630 90,840" fill="#707070" stroke="#5a5a5a" stroke-width="2"/>
    <polygon points="90,840 450,1050 450,1100 90,890" fill="#585858"/>
    <polygon points="450,1050 810,840 810,890 450,1100" fill="#626262"/>
  </g>

  <!-- ==================== 地板 ==================== -->
  <g id="floor">
    <clipPath id="floorClip"><polygon points="450,1020 790,820 450,620 110,820"/></clipPath>
    <g clip-path="url(#floorClip)">
      <rect x="80" y="600" width="740" height="450" fill="#E8E0D8"/>
      <g stroke="#C8B8A0" stroke-width="2" fill="none" opacity="0.8">
        <line x1="110" y1="820" x2="450" y2="620"/><line x1="155" y1="820" x2="450" y2="646"/>
        <line x1="200" y1="820" x2="450" y2="672"/><line x1="245" y1="820" x2="450" y2="698"/>
        <line x1="290" y1="820" x2="450" y2="724"/><line x1="335" y1="820" x2="450" y2="750"/>
        <line x1="380" y1="820" x2="450" y2="776"/><line x1="425" y1="820" x2="450" y2="802"/>
        <line x1="450" y1="620" x2="790" y2="820"/><line x1="450" y1="646" x2="745" y2="820"/>
        <line x1="450" y1="672" x2="700" y2="820"/><line x1="450" y1="698" x2="655" y2="820"/>
        <line x1="450" y1="724" x2="610" y2="820"/><line x1="450" y1="750" x2="565" y2="820"/>
        <line x1="450" y1="776" x2="520" y2="820"/>
      </g>
      <g fill="#D8CDB8" opacity="0.4">
        <circle cx="280" cy="770" r="3"/><circle cx="350" cy="740" r="3"/>
        <circle cx="420" cy="710" r="3"/><circle cx="490" cy="740" r="3"/>
        <circle cx="560" cy="770" r="3"/><circle cx="630" cy="800" r="3"/>
        <circle cx="220" cy="800" r="3"/><circle cx="450" cy="750" r="3"/>
      </g>
      <g fill="#B8A080" opacity="0.3">
        <ellipse cx="250" cy="810" rx="4" ry="2" transform="rotate(25,250,810)"/>
        <ellipse cx="520" cy="808" rx="3.5" ry="1.8" transform="rotate(40,520,808)"/>
        <ellipse cx="640" cy="812" rx="3" ry="1.5" transform="rotate(10,640,812)"/>
        <ellipse cx="380" cy="818" rx="2.5" ry="1.2" transform="rotate(-30,380,818)"/>
      </g>
    </g>
  </g>

  <!-- ==================== 后墙 ==================== -->
  <g id="walls">
    <polygon points="110,820 110,380 450,180 450,620" fill="#F5F0E8" stroke="#E8E0D5" stroke-width="1"/>
    <polygon points="450,620 450,180 790,380 790,820" fill="#F0EBE0" stroke="#E8E0D5" stroke-width="1"/>
    <g stroke="#E8E0D5" stroke-width="0.5" opacity="0.35">
      <line x1="110" y1="420" x2="450" y2="220"/><line x1="110" y1="460" x2="450" y2="260"/>
      <line x1="110" y1="500" x2="450" y2="300"/><line x1="110" y1="540" x2="450" y2="340"/>
      <line x1="110" y1="580" x2="450" y2="380"/><line x1="110" y1="620" x2="450" y2="420"/>
      <line x1="110" y1="660" x2="450" y2="460"/><line x1="110" y1="700" x2="450" y2="500"/>
      <line x1="110" y1="740" x2="450" y2="540"/><line x1="110" y1="780" x2="450" y2="580"/>
      <line x1="190" y1="395" x2="190" y2="805"/><line x1="270" y1="345" x2="270" y2="770"/>
      <line x1="350" y1="295" x2="350" y2="735"/><line x1="430" y1="245" x2="430" y2="700"/>
    </g>
    <g stroke="#E0D8D0" stroke-width="0.5" opacity="0.3">
      <line x1="450" y1="220" x2="790" y2="420"/><line x1="450" y1="260" x2="790" y2="460"/>
      <line x1="450" y1="300" x2="790" y2="500"/><line x1="450" y1="340" x2="790" y2="540"/>
      <line x1="450" y1="380" x2="790" y2="580"/><line x1="450" y1="420" x2="790" y2="620"/>
      <line x1="450" y1="460" x2="790" y2="660"/><line x1="450" y1="500" x2="790" y2="700"/>
      <line x1="530" y1="245" x2="530" y2="700"/><line x1="610" y1="295" x2="610" y2="735"/>
      <line x1="690" y1="345" x2="690" y2="770"/>
    </g>
  </g>

  <!-- ==================== 暖光 ==================== -->
  <rect x="0" y="0" width="900" height="1200" fill="url(#warmGlow)" pointer-events="none"/>

  <!-- ================================================================ -->
  <!-- ==================== 冰箱（左侧）==================== -->
  <!-- ================================================================ -->
  <g id="fridge" filter="url(#shadowH)">
    <polygon points="140,780 140,520 260,460 260,720" fill="#A8D8C8" stroke="#90C0B0" stroke-width="1.5"/>
    <polygon points="260,720 260,460 310,435 310,695" fill="#90C8B5" stroke="#80B8A5" stroke-width="1"/>
    <polygon points="140,520 260,460 310,435 190,495" fill="#B8E8D8" stroke="#A0D8C5" stroke-width="1"/>
    <!-- 门分割线 -->
    <line x1="150" y1="650" x2="255" y2="595" stroke="#88B8A8" stroke-width="1.5"/>
    <!-- 把手 -->
    <line x1="238" y1="565" x2="238" y2="600" stroke="#707070" stroke-width="3" stroke-linecap="round"/>
    <line x1="238" y1="665" x2="238" y2="690" stroke="#707070" stroke-width="3" stroke-linecap="round"/>
    <!-- 高光 -->
    <polygon points="155,540 175,530 175,640 155,650" fill="#B8E0D0" opacity="0.25"/>
    <!-- 顶部杯碟 -->
    <ellipse cx="185" cy="490" rx="14" ry="8" fill="#8898A0" stroke="#708088" stroke-width="1"/>
    <ellipse cx="185" cy="486" rx="10" ry="5" fill="#98A8B0"/>
    <ellipse cx="220" cy="476" rx="12" ry="7" fill="#A08870" stroke="#887060" stroke-width="1"/>
    <ellipse cx="220" cy="472" rx="9" ry="4.5" fill="#B09880"/>
    <ellipse cx="250" cy="462" rx="10" ry="6" fill="#8898A0" stroke="#708088" stroke-width="1"/>
    <!-- 侧面毛巾 -->
    <rect x="265" y="520" width="25" height="45" rx="2" fill="#B8D0E0" stroke="#90B0C8" stroke-width="0.8" transform="skewY(-15) translate(0,280)"/>
    <rect x="272" y="575" width="18" height="32" rx="2" fill="#F0E8E0" stroke="#D8D0C8" stroke-width="0.8" transform="skewY(-15) translate(0,260)"/>
  </g>

  <!-- ================================================================ -->
  <!-- ==================== 灶台+烤箱（冰箱右侧）==================== -->
  <!-- ================================================================ -->
  <g id="stove" filter="url(#shadowH)">
    <!-- 台面（奶白色） -->
    <polygon points="260,720 260,460 420,380 420,640" fill="#F5F0E8" stroke="#E0D8D0" stroke-width="1"/>
    <polygon points="420,640 420,380 470,355 470,615" fill="#E8E0D8" stroke="#D8D0C8" stroke-width="1"/>
    <polygon points="260,460 420,380 470,355 310,435" fill="#FAF5F0" stroke="#E8E0D5" stroke-width="1"/>

    <!-- 烤箱门（深灰色） -->
    <rect x="280" y="560" width="110" height="80" rx="3" fill="#606060" stroke="#505050" stroke-width="1" transform="skewY(-15) translate(0,250)"/>
    <!-- 烤箱玻璃窗 -->
    <rect x="290" y="570" width="90" height="55" rx="2" fill="#404040" stroke="#505050" stroke-width="0.5" transform="skewY(-15) translate(0,250)"/>
    <!-- 烤箱内微光 -->
    <rect x="295" y="575" width="80" height="45" rx="1" fill="#504840" opacity="0.6" transform="skewY(-15) translate(0,250)"/>
    <!-- 4个旋钮 -->
    <circle cx="300" cy="660" r="6" fill="#808080" stroke="#686868" stroke-width="1"/>
    <circle cx="300" cy="660" r="2" fill="#909090"/>
    <circle cx="325" cy="650" r="6" fill="#808080" stroke="#686868" stroke-width="1"/>
    <circle cx="325" cy="650" r="2" fill="#909090"/>
    <circle cx="350" cy="640" r="6" fill="#808080" stroke="#686868" stroke-width="1"/>
    <circle cx="350" cy="640" r="2" fill="#909090"/>
    <circle cx="375" cy="630" r="6" fill="#808080" stroke="#686868" stroke-width="1"/>
    <circle cx="375" cy="630" r="2" fill="#909090"/>
    <!-- 烤箱布巾 -->
    <rect x="310" y="685" width="40" height="20" rx="2" fill="#F0E8E0" stroke="#D8D0C8" stroke-width="0.5" transform="skewY(-15) translate(0,200)"/>

    <!-- 抽油烟机（白色） -->
    <polygon points="270,460 270,380 430,300 430,380" fill="#F0ECE5" stroke="#E0D8D0" stroke-width="1"/>
    <polygon points="430,380 430,300 480,275 480,355" fill="#E5E0D8" stroke="#D8D0C8" stroke-width="1"/>
    <polygon points="270,380 430,300 480,275 320,355" fill="#F5F2ED" stroke="#E8E0D8" stroke-width="1"/>
    <!-- 油烟机出风口 -->
    <line x1="290" y1="375" x2="435" y2="305" stroke="#D0C8C0" stroke-width="1"/>
    <line x1="290" y1="370" x2="435" y2="300" stroke="#D0C8C0" stroke-width="1"/>

    <!-- 灶台上厨具 -->
    <!-- 小银质奶锅 -->
    <ellipse cx="340" cy="420" rx="20" ry="10" fill="#B0B0B0" stroke="#909090" stroke-width="1"/>
    <ellipse cx="340" cy="415" rx="18" ry="8" fill="#C0C0C0"/>
    <line x1="358" y1="418" x2="375" y2="410" stroke="#909090" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 不锈钢水壶 -->
    <ellipse cx="395" cy="405" rx="14" ry="7" fill="#A8A8A8" stroke="#909090" stroke-width="1"/>
    <rect x="385" y="388" width="20" height="17" rx="2" fill="#B8B8B8" stroke="#909090" stroke-width="0.8"/>
    <line x1="405" y1="395" x2="415" y2="385" stroke="#909090" stroke-width="2" stroke-linecap="round"/>
    <!-- 壶盖 -->
    <ellipse cx="395" cy="387" rx="10" ry="5" fill="#C0C0C0"/>
    <circle cx="395" cy="384" r="3" fill="#A0A0A0"/>
  </g>

  <!-- ================================================================ -->
  <!-- ==================== 水槽+橱柜+吊柜（灶台右侧）==================== -->
  <!-- ================================================================ -->
  <g id="sink" filter="url(#shadowH)">
    <!-- 下柜（薄荷绿，同冰箱色） -->
    <polygon points="420,640 420,380 560,310 560,570" fill="#A8D8C8" stroke="#90C0B0" stroke-width="1"/>
    <polygon points="560,570 560,310 610,285 610,545" fill="#90C8B5" stroke="#80B8A5" stroke-width="1"/>
    <polygon points="420,380 560,310 610,285 470,355" fill="#B8E8D8" stroke="#A0D8C5" stroke-width="1"/>
    <!-- 做旧磨损质感 -->
    <polygon points="440,400 440,550 480,530 480,380" fill="#A0D0C0" opacity="0.3"/>

    <!-- 水槽（不锈钢凹陷） -->
    <polygon points="445,395 445,440 520,400 520,355" fill="#909090" stroke="#787878" stroke-width="1"/>
    <polygon points="520,355 520,400 555,382 555,337" fill="#888888" stroke="#707070" stroke-width="1"/>
    <!-- 水槽内 -->
    <polygon points="450,400 450,435 515,397 515,360" fill="#787878"/>
    <!-- 水龙头 -->
    <line x1="480" y1="360" x2="480" y2="320" stroke="#A0A0A0" stroke-width="3" stroke-linecap="round"/>
    <path d="M480,320 Q500,310 510,325" fill="none" stroke="#A0A0A0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="480" cy="358" r="4" fill="#B0B0B0"/>

    <!-- 吊柜 - 上层（带玻璃门薄荷绿） -->
    <polygon points="430,300 430,190 560,125 560,235" fill="#A8D8C8" stroke="#90C0B0" stroke-width="1" opacity="0.9"/>
    <polygon points="560,235 560,125 610,100 610,210" fill="#90C8B5" stroke="#80B8A5" stroke-width="1" opacity="0.9"/>
    <polygon points="430,190 560,125 610,100 480,165" fill="#B8E8D8" stroke="#A0D8C5" stroke-width="1" opacity="0.9"/>
    <!-- 玻璃门高光 -->
    <polygon points="445,200 445,280 510,245 510,165" fill="#C8E8D8" opacity="0.2"/>
    <!-- 内部碗碟 -->
    <ellipse cx="470" cy="220" rx="12" ry="6" fill="#E0D8D0" stroke="#C8C0B8" stroke-width="0.5"/>
    <ellipse cx="490" cy="210" rx="10" ry="5" fill="#D8D0C8" stroke="#C0B8B0" stroke-width="0.5"/>
    <ellipse cx="475" cy="235" rx="8" ry="4" fill="#E8E0D8"/>

    <!-- 吊柜 - 下层（开放式搁板） -->
    <polygon points="430,300 430,250 560,185 560,235" fill="#F0EBE5" stroke="#E0D8D0" stroke-width="0.8"/>
    <polygon points="560,235 560,185 610,160 610,210" fill="#E8E3DD" stroke="#D8D0C8" stroke-width="0.8"/>
    <!-- 搁板上物品 -->
    <!-- 白色水壶 -->
    <ellipse cx="460" cy="230" rx="8" ry="4" fill="#F0F0F0"/>
    <rect x="455" y="218" width="10" height="12" rx="2" fill="#E8E8E8" stroke="#D0D0D0" stroke-width="0.5"/>
    <!-- 碗盘 -->
    <ellipse cx="490" cy="222" rx="10" ry="5" fill="#E8E0D8" stroke="#D0C8C0" stroke-width="0.5"/>
    <ellipse cx="510" cy="215" rx="8" ry="4" fill="#F0E8E0"/>
    <!-- 咖啡机（黑色带金属细节） -->
    <rect x="530" y="195" width="22" height="25" rx="3" fill="#404040" stroke="#303030" stroke-width="0.8"/>
    <rect x="533" y="200" width="16" height="10" rx="1" fill="#555"/>
    <circle cx="541" cy="213" r="3" fill="#888"/>
    <!-- 餐具 -->
    <line x1="495" y1="218" x2="495" y2="235" stroke="#C0C0C0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="500" y1="216" x2="500" y2="233" stroke="#C0C0C0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ================================================================ -->
  <!-- ==================== 墙面挂件 ==================== -->
  <!-- ================================================================ -->

  <!-- 左上角深木色置物架 -->
  <g id="shelf" filter="url(#shadow)">
    <polygon points="130,470 130,420 240,365 240,415" fill="#6B4E3D" stroke="#5A3E30" stroke-width="1"/>
    <polygon points="240,415 240,365 280,345 280,395" fill="#5A4535" stroke="#4A3525" stroke-width="1"/>
    <!-- 陶制锅具 -->
    <ellipse cx="165" cy="410" rx="15" ry="8" fill="#8898A0" stroke="#708088" stroke-width="1"/>
    <ellipse cx="165" cy="405" rx="12" ry="6" fill="#98A8B0"/>
    <!-- 棕褐色杯碟 -->
    <ellipse cx="200" cy="398" rx="10" ry="6" fill="#A08870" stroke="#887060" stroke-width="1"/>
    <ellipse cx="225" cy="390" rx="8" ry="5" fill="#8898A0"/>
    <!-- 小罐 -->
    <rect x="245" y="375" width="12" height="15" rx="3" fill="#A08870" stroke="#887060" stroke-width="0.8"/>
    <ellipse cx="251" cy="374" rx="7" ry="4" fill="#B09880"/>
  </g>

  <!-- 灶台上方墙面挂件 -->
  <g id="wall-items">
    <!-- 金属汤勺 -->
    <line x1="340" y1="280" x2="340" y2="340" stroke="#B0B0B0" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="340" cy="345" rx="6" ry="10" fill="#B8B8B8" stroke="#A0A0A0" stroke-width="0.8"/>
    <!-- 锅铲 -->
    <line x1="365" y1="270" x2="365" y2="330" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round"/>
    <rect x="360" y="332" width="10" height="15" rx="2" fill="#B0B0B0" stroke="#909090" stroke-width="0.8"/>
    <!-- 小型深色煎锅 -->
    <ellipse cx="400" cy="320" rx="18" ry="9" fill="#505050" stroke="#404040" stroke-width="1"/>
    <line x1="416" y1="318" x2="440" y2="308" stroke="#606060" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 藤蔓绿植 -->
    <g transform="translate(355,260)">
      <path d="M0,0 Q-15,20 -8,40" fill="none" stroke="#6B8E50" stroke-width="2"/>
      <path d="M0,0 Q10,25 5,45" fill="none" stroke="#7A9E5A" stroke-width="1.8"/>
      <path d="M0,0 Q-5,15 -12,30" fill="none" stroke="#5A7E40" stroke-width="1.5"/>
      <!-- 叶子 -->
      <ellipse cx="-10" cy="15" rx="6" ry="3" fill="#7A9E5A" transform="rotate(-30,-10,15)"/>
      <ellipse cx="-5" cy="30" rx="7" ry="3" fill="#6B8E50" transform="rotate(20,-5,30)"/>
      <ellipse cx="8" cy="20" rx="5" ry="2.5" fill="#8AAE60" transform="rotate(-15,8,20)"/>
      <ellipse cx="3" cy="38" rx="6" ry="3" fill="#7A9E5A" transform="rotate(10,3,38)"/>
      <ellipse cx="-12" cy="42" rx="5" ry="2.5" fill="#6B8E50" transform="rotate(-25,-12,42)"/>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- ==================== 窗户+窗帘+藤编灯（右侧墙面）==================== -->
  <!-- ================================================================ -->
  <g id="window-area">
    <!-- 窗户白色窗框 -->
    <polygon points="570,320 570,180 730,260 730,400" fill="#E8F0F8" stroke="#D0D8E0" stroke-width="1.5"/>
    <polygon points="730,400 730,260 770,240 770,380" fill="#D8E0E8" stroke="#C8D0D8" stroke-width="1"/>
    <!-- 窗框十字 -->
    <line x1="650" y1="220" x2="650" y2="380" stroke="#D0D8E0" stroke-width="1.5"/>
    <line x1="570" y1="300" x2="730" y2="380" stroke="#D0D8E0" stroke-width="1.5"/>
    <!-- 窗外绿植模糊 -->
    <ellipse cx="660" cy="270" rx="30" ry="15" fill="#8AAE60" opacity="0.2"/>
    <ellipse cx="640" cy="310" rx="20" ry="10" fill="#7A9E5A" opacity="0.15"/>

    <!-- 橙白条纹短窗帘（左侧） -->
    <g transform="translate(545,170)">
      <rect x="0" y="0" width="30" height="80" rx="2" fill="#E8985A" opacity="0.85" transform="skewY(-15)"/>
      <rect x="0" y="0" width="30" height="80" rx="2" fill="url(#curtainStripe)" transform="skewY(-15)"/>
      <!-- 条纹 -->
      <rect x="0" y="8" width="30" height="12" fill="#F5F0E8" opacity="0.4" transform="skewY(-15)"/>
      <rect x="0" y="32" width="30" height="12" fill="#F5F0E8" opacity="0.4" transform="skewY(-15)"/>
      <rect x="0" y="56" width="30" height="12" fill="#F5F0E8" opacity="0.4" transform="skewY(-15)"/>
    </g>
    <!-- 右侧窗帘 -->
    <g transform="translate(710,250)">
      <rect x="0" y="0" width="28" height="70" rx="2" fill="#E8985A" opacity="0.8" transform="skewY(-15)"/>
